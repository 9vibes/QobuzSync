services:
  qobuz-sync:
    build: .
    ports:
      - "127.0.0.1:23809:23809"
    environment:
      QOBUZ_SYNC_DATA_DIR: /data
      QOBUZ_SYNC_BACKGROUND: "1"
      # Protects the dashboard when the port is reachable from the network.
      # Generate one with e.g.: openssl rand -hex 16
      QOBUZ_SYNC_AUTH_TOKEN: ${QOBUZ_SYNC_AUTH_TOKEN:-}
      # Optional: pin Qobuz web credentials if automatic discovery breaks.
      # QOBUZ_APP_ID: ""
      # QOBUZ_SECRETS: "comma,separated,secrets"
      # Set to 1 for purchase discovery tests that should not download audio.
      QOBUZ_SYNC_DRY_RUN: "0"
    volumes:
      - ./data:/data
      - ./downloads:/downloads
    restart: unless-stopped
