services:
  qobuz-sync:
    build: .
    ports:
      - "8080:8080"
    environment:
      QOBUZ_SYNC_DATA_DIR: /data
      QOBUZ_SYNC_BACKGROUND: "1"
      # Optional: pin Qobuz web credentials if automatic discovery breaks.
      # QOBUZ_APP_ID: ""
      # QOBUZ_SECRETS: "comma,separated,secrets"
      # Set to 1 for purchase discovery tests that should not download audio.
      QOBUZ_SYNC_DRY_RUN: "0"
    volumes:
      - ./data:/data
      - ./downloads:/downloads
    restart: unless-stopped
